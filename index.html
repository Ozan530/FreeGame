<!DOCTYPE html>
<html>
<head>
  <title>Süper Oyun</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h1>Süper Düper Oyun 🎮</h1>
<p>Puan: <span id="puan">0</span></p>

<button onclick="arttir()">Tıkla!</button>

<script>
let puan = 0;

function arttir() {
  puan++;
  document.getElementById("puan").innerText = puan;
}
</script>

</body>
</html>
