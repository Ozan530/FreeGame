<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>445577 Clicker Game</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0b0b0b;
      color: white;
    }

    button, input {
      padding: 10px;
      margin: 5px;
    }

    .box {
      border: 1px solid #333;
      padding: 15px;
      margin: 10px auto;
      width: 320px;
      background: #1c1c1c;
      border-radius: 10px;
    }

    #win {
      color: gold;
      display: none;
      font-size: 24px;
    }
  </style>
</head>

<body>

<h1>💰 445577 CLICKER</h1>

<h2>Puan: <span id="puan">0</span></h2>
<h3>Tık Gücü: <span id="guc">1</span></h3>

<button onclick="clickMe()">TIKLA 💥</button>

<!-- MARKET -->
<div class="box">
  <h3>🛒 Market</h3>
  <button onclick="buyPower()">+1 Güç (50)</button>
  <button onclick="buyAuto()">Auto (100)</button>
</div>

<!-- CODE -->
<div class="box">
  <h3>🎟️ Kod Sistemi</h3>
  <input id="code" placeholder="Kod gir">
  <button onclick="useCode()">Kullan</button>
  <p id="msg"></p>
</div>

<h2 id="win">🏆 KAZANDIN!</h2>

<script>
let puan = 0;
let guc = 1;
let auto = 0;
let used = [];

// CLICK
function clickMe() {
  puan += guc;
  update();
}

// MARKET
function buyPower() {
  if (puan >= 50) {
    puan -= 50;
    guc++;
    update();
  }
}

function buyAuto() {
  if (puan >= 100) {
    puan -= 100;
    auto++;

    setInterval(() => {
      puan += auto;
      update();
    }, 1000);
  }
}

// CODE
function useCode() {
  let c = document.getElementById("code").value.toUpperCase();

  if (used.includes(c)) return msg("Kod kullanıldı!");

  if (c === "VIP") {
    puan += 100;
    msg("+100!");
  }
  else if (c === "POWER") {
    guc += 2;
    msg("+2 güç!");
  }
  else if (c === "WIN") {
    puan += 1000000000;
    msg("DEV BONUS!");
  }
  else {
    msg("Geçersiz kod");
    return;
  }

  used.push(c);
  update();
}

// UPDATE
function update() {
  document.getElementById("puan").innerText = puan;
  document.getElementById("guc").innerText = guc;

  if (puan >= 1000) {
    document.getElementById("win").style.display = "block";
  }
}

function msg(t) {
  document.getElementById("msg").innerText = t;
}
</script>

</body>
</html>
