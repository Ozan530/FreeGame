<!DOCTYPE html>
<html>
<head>
  <title>Multiplayer Clicker</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    button {
      padding: 15px;
      font-size: 18px;
    }

    .box {
      margin-top: 20px;
      border: 1px solid #333;
      padding: 10px;
      display: inline-block;
      width: 300px;
    }
  </style>
</head>

<body>

<h1>🌐 Multiplayer Clicker</h1>

<h2>Senin Skorun: <span id="me">0</span></h2>

<button onclick="clickMe()">TIKLA 💥</button>

<div class="box">
  <h3>🏆 Leaderboard</h3>
  <div id="board"></div>
</div>

<script>
let ws;
let myId = null;
let myScore = 0;

ws = new WebSocket("ws://localhost:8080");

ws.onmessage = (msg) => {
  let data = JSON.parse(msg.data);

  if (data.type === "id") {
    myId = data.id;
  }

  if (data.type === "update") {
    render(data.players);
  }
};

function clickMe() {
  myScore++;

  ws.send(JSON.stringify({
    type: "click"
  }));
}

function render(players) {
  let board = document.getElementById("board");
  board.innerHTML = "";

  let arr = Object.entries(players)
    .sort((a,b)=>b[1].score - a[1].score);

  arr.forEach(([id, p]) => {
    let div = document.createElement("div");

    div.innerText =
      (id === myId ? "👉 " : "") +
      id + " : " + p.score;

    board.appendChild(div);

    if (id === myId) {
      document.getElementById("me").innerText = p.score;
    }
  });
}
</script>

</body>
</html>
